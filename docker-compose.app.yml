# Production-style run of the APP IMAGE ONLY.
# Postgres is NOT included — provision it separately (for example, a Coolify
# database container with persistent storage). This compose runs the app and
# points it at the DATABASE_URL you supply.
#
#   docker compose -f docker-compose.app.yml up -d --build
#
# Put your real secrets in a top-level .env (docker compose loads it):
#   DATABASE_URL=postgres://...your-external-postgres...
#   BETTER_AUTH_SECRET=...                 # openssl rand -base64 32
#   PUBLIC_BASE_URL=https://workspace.example.com
#   ADMIN_EMAIL=... ADMIN_PASSWORD=...     # only for first boot; clear after

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genie-workspace:latest
    container_name: genie-app
    restart: unless-stopped
    environment:
      # External Postgres — supplied by you, NOT run in this compose.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (external Postgres)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GENIE_CHAT_API_ALLOWED_ORIGINS: ${GENIE_CHAT_API_ALLOWED_ORIGINS:-}
      ALLOWED_IFRAME_ORIGINS: ${ALLOWED_IFRAME_ORIGINS:-}
    ports:
      - "${APP_PORT:-3000}:3000"
