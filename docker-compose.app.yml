# Production-style run of the APP IMAGE ONLY.
# Postgres is NOT included — in production the database runs on a managed /
# dedicated host (RDS, Cloud SQL, Crunchy Bridge, a bare-metal server, etc.)
# for performance, backups, and operational control. This compose just runs the
# app and points it at the external DATABASE_URL you supply.
#
#   docker compose -f docker-compose.app.yml up -d --build
#
# Put your real secrets in a top-level .env (docker compose loads it):
#   DATABASE_URL=postgres://...your-external-postgres...
#   BETTER_AUTH_SECRET=...                 # openssl rand -base64 32
#   PUBLIC_BASE_URL=https://workspace.example.com
#   ADMIN_EMAIL=... ADMIN_PASSWORD=...     # only for first boot; clear after

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genie-workspace:latest
    container_name: genie-app
    restart: unless-stopped
    environment:
      # External Postgres — supplied by you, NOT run in this compose.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (external Postgres)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GENIE_CHAT_API_ALLOWED_ORIGINS: ${GENIE_CHAT_API_ALLOWED_ORIGINS:-}
      ALLOWED_IFRAME_ORIGINS: ${ALLOWED_IFRAME_ORIGINS:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
