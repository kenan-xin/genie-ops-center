# Dev-only database. Run the app on your host with `pnpm dev`; this just provides
# Postgres in a container with a persistent volume.
#
#   pnpm db:dev          # start (or: docker compose -f docker-compose.dev.yml up -d)
#   pnpm db:dev:stop     # stop
#   pnpm db:dev:down     # stop + delete the container (data volume is kept)
#   pnpm db:dev:reset    # stop + delete the volume (WIPES local data)
#
# Credentials match .env.example's DATABASE_URL. Override via the PG_* vars below
# or a top-level .env file (docker compose loads it automatically).

services:
  db:
    image: postgres:16-alpine
    container_name: genie-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genie}
      POSTGRES_DB: ${POSTGRES_DB:-genie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - genie-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genie} -d ${POSTGRES_DB:-genie}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  genie-db-dev:
